<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ValStats Operations</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
            background: #080d12;
            color: #e9eef2
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #080d12
        }

        header, main {
            width: min(1000px, calc(100% - 32px));
            margin: auto
        }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #222e37
        }

        .brand {
            font-weight: 850;
            letter-spacing: .08em
        }

        .brand span {
            color: #e8c35b
        }

        button {
            border: 1px solid #33414c;
            border-radius: 6px;
            background: #111920;
            color: #b8c2c9;
            padding: 8px 12px;
            cursor: pointer
        }

        main {
            padding-block: 34px
        }

        .eyebrow {
            color: #e8c35b;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .14em;
            text-transform: uppercase
        }

        h1 {
            margin: 8px 0 6px;
            font-size: 30px
        }

        p {
            margin: 0;
            color: #8997a1
        }

        .grid {
            display: grid;
            grid-template-columns:repeat(auto-fit, minmax(270px, 1fr));
            gap: 14px;
            margin-top: 28px
        }

        .card {
            padding: 19px;
            border: 1px solid #26333d;
            border-radius: 10px;
            background: #0e151c
        }

        .card h2 {
            margin: 0 0 18px;
            font-size: 14px
        }

        .metrics {
            display: grid;
            grid-template-columns:repeat(3, 1fr);
            gap: 8px
        }

        .metric {
            padding: 12px 8px;
            border-radius: 7px;
            background: #0a1015;
            text-align: center
        }

        .metric strong {
            display: block;
            font-size: 24px
        }

        .metric small {
            color: #7e8b94;
            font-size: 9px;
            font-weight: 750;
            letter-spacing: .08em;
            text-transform: uppercase
        }

        .offline {
            color: #e58b92
        }
    </style>
</head>
<body>
<header>
    <div class="brand">VAL<span>STATS</span> / ADMIN</div>
    <form method="post" action="/admin/logout">
        <button type="submit">Sign out</button>
    </form>
</header>
<main><span class="eyebrow">Operations</span>
    <h1>System overview</h1>
    <p>Approximate live queue activity from AWS SQS.</p>
    <section class="grid">
        <article class="card" th:each="queue : ${queues}">
            <h2 th:text="${queue.name}">Queue</h2>
            <div class="metrics" th:if="${queue.available}">
                <div class="metric"><strong th:text="${queue.waiting}">0</strong><small>Waiting</small></div>
                <div class="metric"><strong th:text="${queue.running}">0</strong><small>Running</small></div>
                <div class="metric"><strong th:text="${queue.delayed}">0</strong><small>Delayed</small></div>
            </div>
            <p class="offline" th:unless="${queue.available}">Queue is not configured.</p>
        </article>
    </section>
</main>
</body>
</html>

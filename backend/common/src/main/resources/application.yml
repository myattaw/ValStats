micronaut:
  application:
    name: valstats
  server:
    cors:
      enabled: true
      configurations:
        allowed:
          allowed-origins:
            - "http://localhost:3000" # Replace with your frontend URL
            - "http://localhost:5173"
          allowed-methods:
            - GET
            - POST
            - PUT
            - DELETE
          allowed-headers:
            - "*"
    port: 8080
    response-compression:
      enabled: true
      mime-types: application/json
  http:
    client:
      read-timeout: 30s
      url-encoding: standard

netty:
  default:
    allocator:
      max-order: 3

aws:
  region: us-east-1

dynamodb:
  table-name: valstats

henrik-api:
  rate-limit:
    # Instance-local smoothing. Override these from environment-specific config
    # when the Henrik plan's RateLimit-Policy allows a higher sustained rate.
    requests-per-second: 1
    max-queued-requests: 100
    max-retries: 3
    max-retry-delay-seconds: 60
